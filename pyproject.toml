[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "automoonbot"
version = "0.2.0"
description = "Point-in-time graph research platform for systematic trading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pyarrow>=22",
    "tzdata; sys_platform == 'win32'",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
torch = ["torch>=2.9", "torch_geometric>=2.7"]
dev = ["pytest>=9", "ruff>=0.14", "mypy>=1.18"]

[tool.maturin]
manifest-path = "moonrs/Cargo.toml"
python-source = "python"
module-name = "automoonbot._moonrs"
features = ["python"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.ruff.lint.isort]
# Explicit, so import order does not depend on whether the package is installed.
known-first-party = ["automoonbot"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["python/automoonbot"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torch_geometric", "torch_geometric.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
