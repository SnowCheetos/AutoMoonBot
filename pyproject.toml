[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "automoonbot"
version = "0.2.0"
description = "Point-in-time graph research platform for systematic trading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "torch_geometric>=2.6"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.maturin]
manifest-path = "moonrs/Cargo.toml"
python-source = "python"
module-name = "automoonbot._moonrs"
features = ["python"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/automoonbot"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torch_geometric", "torch_geometric.*"]
ignore_missing_imports = true
