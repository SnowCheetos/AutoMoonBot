[package]
name = "moonrs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bitemporal, point-in-time heterogeneous graph store for leakage-free market research"
publish = false

[lib]
name = "moonrs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
crc32fast = "1.5"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }
thiserror = "2.0"
pyo3 = { version = "0.30", optional = true, features = ["abi3-py310"] }
numpy = { version = "0.30", optional = true }

[dev-dependencies]
proptest = "1.12"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
